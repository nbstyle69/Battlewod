name: Integration Tests (Supabase)

# Déclenchement MANUEL uniquement.
#
# Ce workflow tournait sur push main/master et visait la base de PRODUCTION
# (URL en dur + service_role) : chaque merge y créait puis y supprimait des
# comptes, des box, des tournois et des centaines de scores. Il monte désormais
# sa propre pile Supabase jetable et n'a plus aucun secret de prod.
on:
  workflow_dispatch:
    inputs:
      keep_data:
        description: 'Garder les données de test en DB (--keep-data)'
        required: false
        default: false
        type: boolean
      suite:
        description: 'Suite à exécuter'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - agents
          - formats
          - league
          - bo-owner
          - athlete
          - rls

jobs:
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Set keep-data flag
        id: flags
        run: |
          if [ "${{ github.event.inputs.keep_data }}" = "true" ]; then
            echo "extra_flag=--keep-data" >> $GITHUB_OUTPUT
          else
            echo "extra_flag=" >> $GITHUB_OUTPUT
          fi

      # ── Cible jetable : Postgres + PostgREST + GoTrue locaux, schéma rejoué ──
      - name: Pile Supabase éphémère (baseline + migrations)
        run: ./scripts/test-stack.sh up

      - name: Exporter la cible de test
        run: cat /tmp/athlex-test-stack.env >> $GITHUB_ENV

      # Aucune de ces étapes ne reçoit de secret : la cible est locale au runner.
      - name: Suite — Multi-Agent Tournaments
        if: ${{ github.event.inputs.suite == 'all' || github.event.inputs.suite == 'agents' }}
        run: node scripts/test-agents.mjs ${{ steps.flags.outputs.extra_flag }}

      - name: Suite — Tournament Formats (bracket/swiss/league)
        if: ${{ github.event.inputs.suite == 'all' || github.event.inputs.suite == 'formats' }}
        run: node scripts/test-formats.mjs ${{ steps.flags.outputs.extra_flag }}

      - name: Suite — League Detailed (32 agents, 5 saisons)
        if: ${{ github.event.inputs.suite == 'all' || github.event.inputs.suite == 'league' }}
        run: node scripts/test-league-detailed.mjs ${{ steps.flags.outputs.extra_flag }}

      - name: Suite — BO Owner (full lifecycle)
        if: ${{ github.event.inputs.suite == 'all' || github.event.inputs.suite == 'bo-owner' }}
        run: node scripts/test-bo-owner.mjs ${{ steps.flags.outputs.extra_flag }}

      - name: Suite — Athlete (app mobile flows)
        if: ${{ github.event.inputs.suite == 'all' || github.event.inputs.suite == 'athlete' }}
        run: node scripts/test-athlete.mjs ${{ steps.flags.outputs.extra_flag }}

      - name: Suite — RLS
        if: ${{ github.event.inputs.suite == 'all' || github.event.inputs.suite == 'rls' }}
        run: node scripts/test-rls.mjs

      - name: Arrêt de la pile
        if: always()
        run: ./scripts/test-stack.sh down
