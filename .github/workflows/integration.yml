name: Integration Tests (Supabase)

# Ce workflow visait autrefois la base de PRODUCTION (URL en dur +
# service_role) : chaque merge y créait puis y supprimait des comptes, des box,
# des tournois et des centaines de scores. Il a été passé en manuel pour cette
# raison — mais un contrôle que personne ne lance ne protège rien, et il est
# resté muet dix jours en affichant le rouge d'un défaut déjà corrigé.
#
# Il monte maintenant sa propre pile Supabase jetable, locale au runner et sans
# aucun secret : le retenir n'a plus d'objet.
on:
  schedule:
    # Nocturne : attrape les régressions de schéma qu'aucun push ne touche
    # directement (une RPC qui dépend d'une policy modifiée ailleurs).
    - cron: '30 3 * * *'

  push:
    branches: [master]
    paths:
      - 'supabase/**'
      - 'scripts/**'
      - '.github/workflows/integration.yml'

  workflow_dispatch:
    inputs:
      keep_data:
        description: 'Garder les données de test en DB (--keep-data)'
        required: false
        default: false
        type: boolean
      suite:
        description: 'Suite à exécuter'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - agents
          - formats
          - league
          - auth-links
          - bo-owner
          - athlete
          - rls
          - templates
          - strength
          - wod-access
          - wod-derived
          - admin-boxes
          - programs-box
          - comptoir-programmes
          - abonnement-programmation
          - espace-coach
          - heures
          - essai
          - elo
          - group-messages
          - onboarding
          - grants

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # `github.event.inputs.*` est vide hors `workflow_dispatch` : sans ce
      # repli, les conditions des suites deviennent `'' == 'all'` — fausses — et
      # le job passe au vert en n'exécutant **aucune** suite. Un vert qui ne
      # mesure rien est pire que le rouge qu'il remplace.
      - name: Résoudre les paramètres du run
        id: flags
        run: |
          set -euo pipefail
          suite='${{ github.event.inputs.suite }}'
          [ -n "$suite" ] || suite='all'
          echo "suite=$suite" >> "$GITHUB_OUTPUT"
          echo "suite retenue : $suite (événement ${{ github.event_name }})"

          if [ "${{ github.event.inputs.keep_data }}" = "true" ]; then
            echo "extra_flag=--keep-data" >> "$GITHUB_OUTPUT"
          else
            echo "extra_flag=" >> "$GITHUB_OUTPUT"
          fi

      # ── Cible jetable : Postgres + PostgREST + GoTrue locaux, schéma rejoué ──
      - name: Pile Supabase éphémère (baseline + migrations)
        run: ./scripts/test-stack.sh up

      - name: Exporter la cible de test
        run: cat /tmp/athlex-test-stack.env >> $GITHUB_ENV

      # Aucune de ces étapes ne reçoit de secret : la cible est locale au runner.
      - name: Suite — Multi-Agent Tournaments
        if: ${{ steps.flags.outputs.suite == 'all' || steps.flags.outputs.suite == 'agents' }}
        run: node scripts/test-agents.mjs ${{ steps.flags.outputs.extra_flag }}

      - name: Suite — Tournament Formats (bracket/swiss/league)
        if: ${{ steps.flags.outputs.suite == 'all' || steps.flags.outputs.suite == 'formats' }}
        run: node scripts/test-formats.mjs ${{ steps.flags.outputs.extra_flag }}

      - name: Suite — League Detailed (32 agents, 5 saisons)
        if: ${{ steps.flags.outputs.suite == 'all' || steps.flags.outputs.suite == 'league' }}
        run: node scripts/test-league-detailed.mjs ${{ steps.flags.outputs.extra_flag }}

      - name: Suite — BO Owner (full lifecycle)
        if: ${{ steps.flags.outputs.suite == 'all' || steps.flags.outputs.suite == 'bo-owner' }}
        run: node scripts/test-bo-owner.mjs ${{ steps.flags.outputs.extra_flag }}

      - name: Suite — Athlete (app mobile flows)
        if: ${{ steps.flags.outputs.suite == 'all' || steps.flags.outputs.suite == 'athlete' }}
        run: node scripts/test-athlete.mjs ${{ steps.flags.outputs.extra_flag }}

      - name: Suite — RLS
        if: ${{ steps.flags.outputs.suite == 'all' || steps.flags.outputs.suite == 'rls' }}
        run: node scripts/test-rls.mjs

      - name: Suite — Semaines types (programmation)
        if: ${{ steps.flags.outputs.suite == 'all' || steps.flags.outputs.suite == 'templates' }}
        run: node scripts/test-templates.mjs ${{ steps.flags.outputs.extra_flag }}

      - name: Suite — Journal des séries réalisées (suivi athlète)
        if: ${{ steps.flags.outputs.suite == 'all' || steps.flags.outputs.suite == 'strength' }}
        run: node scripts/test-strength-journal.mjs ${{ steps.flags.outputs.extra_flag }}

      # L'autorisation du contenu payant : la policy de box_wods doit refuser,
      # pas le client. Le contrôle positif (WOD libre visible de tous) est dans
      # la suite : sans lui, un refus massif se lirait comme un succès.
      - name: Suite — Accès aux WOD restreints (programme / groupe)
        if: ${{ steps.flags.outputs.suite == 'all' || steps.flags.outputs.suite == 'wod-access' }}
        run: node scripts/test-wod-access.mjs ${{ steps.flags.outputs.extra_flag }}

      # Fermer le WOD sans fermer ses dérivés est une garde sur deux : le
      # classement, les complétions, les gains d'ELO, les commentaires et les
      # réactions d'un WOD restreint passent par la même garde que le WOD.
      - name: Suite — Lectures dérivées d'un WOD restreint (score, ELO, commentaires)
        if: ${{ steps.flags.outputs.suite == 'all' || steps.flags.outputs.suite == 'wod-derived' }}
        run: node scripts/test-wod-derived-reads.mjs ${{ steps.flags.outputs.extra_flag }}

      # Le titre qui ouvre ou ferme les routes argent : owner/co-gérant vs coach.
      # Le contrôle positif (le gérant administre bien sa box) empêche « personne
      # n'administre rien » de se lire comme un succès.
      - name: Suite — Résolveur des box administrées (titre owner / coach)
        if: ${{ steps.flags.outputs.suite == 'all' || steps.flags.outputs.suite == 'admin-boxes' }}
        run: node scripts/test-admin-boxes.mjs ${{ steps.flags.outputs.extra_flag }}

      # Un programme appartient à sa box (pas à une personne), son contenu vit
      # dans box_wods, et dispenser de payer reste une décision d'argent. Le
      # contrôle positif : le WOD sans restriction reste visible des membres.
      - name: Suite — Programmes administrés par la box (contenu, grants, staff)
        if: ${{ steps.flags.outputs.suite == 'all' || steps.flags.outputs.suite == 'programs-box' }}
        run: node scripts/test-programs-par-box.mjs ${{ steps.flags.outputs.extra_flag }}

      # L'encaissement comptoir d'un programme : qui le tient, où va le montant,
      # et les deux surfaces d'argent dans les deux sens — une ligne comptoir
      # fait monter « Programmes » sans être recomptée en « comptoir », une
      # ligne staff ne fait monter ni l'un ni l'autre.
      - name: Suite — Payé au comptoir (programmes, journal, surfaces d'argent)
        if: ${{ steps.flags.outputs.suite == 'all' || steps.flags.outputs.suite == 'comptoir-programmes' }}
        run: node scripts/test-comptoir-programmes.mjs ${{ steps.flags.outputs.extra_flag }}

      # Une offre payante ne s'obtient pas sans payer : `status='active'` est
      # réservé au backend signé, la RPC du gratuit relit le prix dans l'offre.
      # Contrôles positifs : le webhook active toujours, et le coach lit
      # toujours le catalogue publié.
      - name: Suite — Abonnement à une programmation (payant, gratuit, prix)
        if: ${{ steps.flags.outputs.suite == 'all' || steps.flags.outputs.suite == 'abonnement-programmation' }}
        run: node scripts/test-abonnement-programmation.mjs ${{ steps.flags.outputs.extra_flag }}

      # L'espace coach : le coach programme (semaines types, grille de créneaux)
      # mais ne lit pas « qui paie quoi », ne publie pas et ne fixe pas de prix.
      # Contrôles positifs : le gérant et le co-gérant lisent l'abonnement
      # nominatif, l'adhérent lit le sien, et le coach garde le roster.
      - name: Suite — Espace coach (programmation, résidu nominatif)
        if: ${{ steps.flags.outputs.suite == 'all' || steps.flags.outputs.suite == 'espace-coach' }}
        run: node scripts/test-espace-coach.mjs ${{ steps.flags.outputs.extra_flag }}

      # Les heures de créneau sont du texte que tous les lecteurs parsent comme
      # `HH:MM` (instant par concaténation, tri de chaînes, déduplication de la
      # génération). La garde refuse les autres graphies — nommément, et même au
      # service_role : une contrainte n'est pas une policy.
      - name: Suite — Format HH:MM des heures de début
        if: ${{ steps.flags.outputs.suite == 'all' || steps.flags.outputs.suite == 'heures' }}
        run: node scripts/test-heures.mjs ${{ steps.flags.outputs.extra_flag }}

      # Le tunnel Essai est la seule écriture publique du produit : les refus
      # sont nommés, la place est réellement décomptée, et les coordonnées ne
      # sont pas dans la table que tout adhérent de la box lit. Contrôles
      # positifs et négatifs dans la même suite — dont « le plan_type inventé
      # reste refusé », sans quoi on aurait ouvert le CHECK au lieu de l'étendre.
      - name: Suite — Offre Essai (tunnel public, prospects, capacité)
        if: ${{ steps.flags.outputs.suite == 'all' || steps.flags.outputs.suite == 'essai' }}
        run: node scripts/test-essai-lot-base.mjs ${{ steps.flags.outputs.extra_flag }}

      # Le récapitulatif du gérant confondait un essai avec une présence
      # d'adhérent. La suite mesure le CONTENU du lot, avec son contrôle
      # négatif : sans le filtre, le même périmètre compte 2 — sinon un vert
      # ne distinguerait pas « le filtre trie » de « rien à trier ».
      - name: Suite — Récapitulatif hebdo (essais comptés à part)
        if: ${{ steps.flags.outputs.suite == 'all' || steps.flags.outputs.suite == 'essai' }}
        run: node scripts/test-essai-digest.mjs ${{ steps.flags.outputs.extra_flag }}

      # Clôture de tournoi : une seule fonction serveur (tous formats) écrit
      # historique + profils dans la même transaction. La suite prouve
      # profiles.elo = dernier elo_after, le refus de seconde clôture, et le
      # piège PostgREST (PATCH d'un autre profil → 204 et 0 ligne). La mutation
      # inverse retire l'UPDATE du profil dans la fonction : la suite doit rougir.
      - name: Suite — Clôture ELO serveur (finalize_tournament_elo)
        if: ${{ steps.flags.outputs.suite == 'all' || steps.flags.outputs.suite == 'elo' }}
        run: node scripts/test-finalize-elo.mjs
      - name: Suite — Clôture ELO, mutation inverse
        if: ${{ steps.flags.outputs.suite == 'all' || steps.flags.outputs.suite == 'elo' }}
        run: ./scripts/test-finalize-elo-mutation.sh

      # Messagerie de groupe : group_messages.sender_id → profiles ON DELETE SET NULL.
      # Suppression d'un compte par delete_user_account → ses messages restent,
      # sender_id NULL. La mutation inverse retire la clé : la suite doit rougir.
      - name: Suite — group_messages.sender_id survit à la suppression du compte
        if: ${{ steps.flags.outputs.suite == 'all' || steps.flags.outputs.suite == 'group-messages' }}
        run: node scripts/test-group-messages-sender.mjs
      - name: Suite — group_messages, mutation inverse
        if: ${{ steps.flags.outputs.suite == 'all' || steps.flags.outputs.suite == 'group-messages' }}
        run: ./scripts/test-group-messages-sender-mutation.sh

      # « Présentation vue » côté compte : profiles.onboarding_completed_at, écrite
      # par mark_onboarding_completed (idempotente, authenticated seulement), relue
      # par get_my_profile. Compte neuf NULL, autre compte intact, anon refusé.
      - name: Suite — onboarding_completed_at (présentation vue côté compte)
        if: ${{ steps.flags.outputs.suite == 'all' || steps.flags.outputs.suite == 'onboarding' }}
        run: node scripts/test-onboarding-completed.mjs

      # Liens e-mail Auth : GoTrue génère le vrai lien (verify?token=…&type=…&
      # redirect_to=…), on suit le 303 et on lit le Location. signup → /email-confirme,
      # recovery avec redirectTo → /update-password, recovery sans → Site URL (A4).
      - name: Suite — Liens e-mail GoTrue (signup / recovery)
        if: ${{ steps.flags.outputs.suite == 'all' || steps.flags.outputs.suite == 'auth-links' }}
        run: node scripts/test-auth-links.mjs

      # Contrôle de catalogue : ce que la base accorde réellement, pas ce que
      # les migrations avaient l'intention d'accorder.
      - name: Suite — Grants EXECUTE (schéma public)
        if: ${{ steps.flags.outputs.suite == 'all' || steps.flags.outputs.suite == 'grants' }}
        run: node scripts/test-grants.mjs

      - name: Arrêt de la pile
        if: always()
        run: ./scripts/test-stack.sh down
