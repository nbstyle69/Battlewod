name: État du projet

on:
  pull_request:
    branches: [main, master]

jobs:
  etat-projet:
    name: Un lot qui se ferme porte sa ligne d'état
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Liste des fichiers changés
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > /tmp/changed.txt
          cat /tmp/changed.txt

      - name: Contrôle
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-etat-projet.mjs /tmp/changed.txt
