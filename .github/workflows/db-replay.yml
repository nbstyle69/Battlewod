name: DB replay (base vierge)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

# Un rejeu qui se bloque (runner ou image indisponible) laisse sinon la PR en
# « checks pending » indéfiniment : la révision suivante annule la précédente.
concurrency:
  group: db-replay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    name: Rejeu baseline + migrations
    runs-on: ubuntu-latest
    # Le rejeu complet prend ~1 min : au-dela, c'est un blocage, pas une lenteur.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # `apt-get update` s'est bloque 50 min sur un runner (miroir injoignable,
      # sans jamais rendre la main) : l'image des runners fournit deja psql, on
      # ne va au reseau que s'il manque vraiment, et sous plafond de temps.
      - name: Client psql
        timeout-minutes: 5
        run: |
          if command -v psql >/dev/null 2>&1; then
            psql --version
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Rejeu sur base vierge
        run: ./scripts/db-replay.sh

      - name: Rappel
        if: failure()
        run: |
          echo "::error::Une migration n'est pas rejouable sur base vierge."
          echo "Le schema de prod est reconstruit par supabase/migrations/ :"
          echo "  - baseline 20260301000000_baseline_prod_schema.sql"
          echo "  - puis chaque migration suivante, dans l'ordre."
          echo "Corrige la migration fautive (ou son ordonnancement) avant merge."
          echo "L'historique d'avant baseline est dans supabase/migrations_archive/, il n'est plus rejoue."
