project_id = "battlewod"

[db]
port = 54322
major_version = 17

# Le baseline ALTER `storage.objects`, dont le rôle utilisé par la CLI n'est pas
# propriétaire : l'application automatique échoue. `scripts/test-stack.sh` rejoue
# supabase/migrations en `supabase_admin` juste après le démarrage.
[db.migrations]
enabled = false

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[studio]
enabled = false

[inbucket]
enabled = false

[storage]
enabled = true

[auth]
enabled = true
site_url = "https://the-hub-rho.vercel.app/update-password"
additional_redirect_urls = ["https://the-hub-rho.vercel.app/**"]

[analytics]
enabled = false

[edge_runtime]
enabled = false
