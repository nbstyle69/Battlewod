project_id = "battlewod"

[db]
port = 54322
major_version = 17

# Le baseline ALTER `storage.objects`, dont le rôle utilisé par la CLI n'est pas
# propriétaire : l'application automatique échoue. `scripts/test-stack.sh` rejoue
# supabase/migrations en `supabase_admin` juste après le démarrage.
[db.migrations]
enabled = false

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[studio]
enabled = false

[inbucket]
enabled = false

[storage]
enabled = true

[auth]
enabled = true
# Même valeur qu'en prod : chaque flux porte son redirectTo, le Site URL ne route rien.
site_url = "https://athlexapp.eu/email-confirme"
additional_redirect_urls = ["https://athlexapp.eu/**", "https://www.athlexapp.eu/**"]

[analytics]
enabled = false

[edge_runtime]
enabled = false
